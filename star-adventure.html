<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#05060f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="星星冒險">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>星星電子世界冒險</title>
<style>
  :root{--cyan:#35e6ff;--purple:#a06bff;--amber:#ffc24a;--mint:#5dffc0;--bg:#05060f;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:#e8f6ff;
    font-family:"PingFang HK","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
    -webkit-user-select:none;user-select:none}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:3}
  .hud{position:fixed;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 10px calc(12px + env(safe-area-inset-left));display:flex;gap:8px;align-items:flex-start;
    justify-content:space-between;pointer-events:none;z-index:5}
  .pill{pointer-events:auto;background:rgba(8,14,34,.72);border:1px solid rgba(53,230,255,.45);
    border-radius:10px;padding:7px 11px;font-size:14px;line-height:1.2;color:#e8f6ff;text-decoration:none;
    box-shadow:0 0 12px rgba(53,230,255,.18) inset;font-family:inherit}
  .pill b{color:var(--amber);font-size:16px}
  .left{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
  .right{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
  .slots{display:grid;grid-template-columns:repeat(6,21px);gap:4px;padding:6px 0 0;justify-content:end}
  .slot{width:21px;height:21px;font-size:15px;line-height:21px;text-align:center;filter:grayscale(1) brightness(.7);opacity:.4;transition:opacity .4s,filter .4s}
  .slot.on{filter:drop-shadow(0 0 5px var(--c,#35e6ff));opacity:1}
  #nav{position:fixed;left:50%;top:calc(150px + env(safe-area-inset-top));transform:translateX(-50%);z-index:5;pointer-events:none;
    display:flex;align-items:center;gap:8px;font-size:13px;background:rgba(8,14,34,.6);
    border:1px solid rgba(93,255,192,.4);border-radius:20px;padding:5px 12px;white-space:nowrap}
  #arrow{width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;
    border-bottom:14px solid var(--mint);filter:drop-shadow(0 0 4px var(--mint))}
  #zone{position:fixed;left:50%;top:calc(192px + env(safe-area-inset-top));transform:translate(-50%,-8px);z-index:5;pointer-events:none;opacity:0;
    font-size:24px;font-weight:700;letter-spacing:.3em;padding-left:.3em;color:var(--c,#35e6ff);white-space:nowrap;
    text-shadow:0 0 14px var(--c,#35e6ff),0 0 2px #000;transition:opacity .4s,transform .4s}
  #zone.show{opacity:1;transform:translate(-50%,0)}
  #card{position:fixed;left:50%;top:30%;transform:translate(-50%,-10px);z-index:6;width:min(86vw,360px);
    text-align:center;background:rgba(8,14,34,.9);border:1px solid var(--c,#35e6ff);border-radius:14px;
    padding:14px 16px;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;
    box-shadow:0 0 26px color-mix(in srgb,var(--c,#35e6ff) 45%,transparent)}
  #card.show{opacity:1;transform:translate(-50%,0)}
  #card small{display:block;font-size:12px;letter-spacing:.2em;color:#9fb6d6}
  #card h2{margin:6px 0 4px;font-size:28px;color:var(--c,#35e6ff);text-shadow:0 0 12px var(--c,#35e6ff)}
  #card p{margin:0;font-size:15px;line-height:1.5}
  #jump{position:fixed;right:calc(22px + env(safe-area-inset-right));bottom:calc(34px + env(safe-area-inset-bottom));width:78px;height:78px;border-radius:50%;z-index:5;
    border:2px solid var(--amber);background:rgba(255,194,74,.14);color:var(--amber);font-size:17px;font-weight:700;
    font-family:inherit;touch-action:none;box-shadow:0 0 16px rgba(255,194,74,.35)}
  #jump:active{background:rgba(255,194,74,.35)}
  #joy{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;z-index:4;display:none;
    border:2px solid rgba(53,230,255,.5);background:rgba(53,230,255,.07);pointer-events:none}
  #knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;
    background:rgba(53,230,255,.45);box-shadow:0 0 14px var(--cyan)}
  .panel{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
    gap:14px;padding:calc(64px + env(safe-area-inset-top)) 24px calc(40px + env(safe-area-inset-bottom));text-align:center;
    background:linear-gradient(180deg,rgba(5,6,15,.82) 0%,rgba(5,6,15,0) 30%,rgba(5,6,15,0) 58%,rgba(5,6,15,.9) 100%)}
  .panel.solid{justify-content:center;background:radial-gradient(ellipse at 50% 40%,rgba(30,20,80,.86),rgba(5,6,15,.95))}
  .panel h1{margin:0;font-size:30px;letter-spacing:.08em;color:var(--cyan);text-shadow:0 0 18px rgba(53,230,255,.7)}
  .panel p{margin:0;max-width:330px;font-size:15px;line-height:1.7;color:#cfe3ff}
  .panel .tip{font-size:13px;color:#9fb6d6}
  .grp{display:flex;flex-direction:column;align-items:center;gap:12px}
  .btn{font-family:inherit;font-size:18px;font-weight:700;color:#05060f;background:linear-gradient(90deg,var(--cyan),var(--mint));
    border:0;border-radius:12px;padding:13px 34px;box-shadow:0 0 22px rgba(53,230,255,.5)}
  .hide{display:none!important}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="flash"></div>
<div id="dbg" class="hide" style="position:fixed;left:8px;right:8px;bottom:8px;z-index:20;font-size:12px;color:#ffb0b0;background:rgba(40,0,0,.8);padding:6px 8px;border-radius:8px"></div>

<div class="hud">
  <div class="left">
    <a class="pill" href="https://portfolio.rcgs.edu.hk">← 返回</a>
    <button class="pill" id="fx">特效：開</button>
    <button class="pill" id="snd">聲音：開</button>
    <button class="pill hide" id="fs">全螢幕</button>
  </div>
  <div class="right">
    <div class="pill">⭐ 星星 <b id="sc">0</b> / <span id="st">0</span></div>
    <div class="pill" style="text-align:right">💎 價值觀寶藏 <b id="tc">0</b> / 12<div class="slots" id="slots" aria-label="價值觀寶藏進度"></div></div>
  </div>
</div>
<div id="nav" class="hide"><div id="arrow"></div><span id="navt"></span></div>
<div id="zone"></div>
<div id="card"><small>獲得價值觀寶藏</small><div id="ci" style="font-size:42px;line-height:1.2;margin-top:4px"></div><h2 id="cn"></h2><p id="cd"></p></div>
<div id="joy"><div id="knob"></div></div>
<button id="jump" class="hide">跳躍</button>

<div class="panel" id="start">
  <div class="grp">
    <h1>星星電子世界冒險</h1>
    <p>穿越四個電子世界，收集星星，尋回十二個價值觀寶藏。</p>
  </div>
  <div class="grp">
    <button class="btn" id="go">開始冒險</button>
    <button class="btn hide" id="go2" style="font-size:15px;padding:9px 22px;background:linear-gradient(90deg,#ffc24a,#ff9d6b)">第二章：太空船 🚀</button>
    <p class="tip">手機：左半邊拖動以移動，右半邊拖動以轉動視角，可連跳兩次<br>電腦：WASD／方向鍵移動，空白鍵跳躍，拖動滑鼠轉動視角<br>踏上綠色彈射台可以飛上高空</p>
  </div>
</div>
<div class="panel solid hide" id="win">
  <h1>任務完成</h1>
  <p>你已尋回全部十二個價值觀寶藏，並收集了 <b id="ws" style="color:var(--amber)"></b> 顆星星。</p>
  <button class="btn" id="next" style="background:linear-gradient(90deg,#ffc24a,#ff9d6b)">進入第二章 🚀</button>
  <button class="btn" id="again" style="font-size:15px;padding:9px 22px">再玩一次</button>
</div>
<div class="panel solid hide" id="fin">
  <h1>抵達恩慈星 🪐</h1>
  <p>你帶着價值觀飛越星海，成功抵達恩慈星。<br>收集星星 <b id="fs2" style="color:var(--amber)"></b>　穿越價值觀之門 <b id="fg2" style="color:var(--mint)"></b></p>
  <button class="btn" id="again2">再飛一次</button>
  <button class="btn" id="back1" style="font-size:15px;padding:9px 22px">回到第一章</button>
</div>
<div class="panel solid hide" id="err"><h1>無法載入</h1><p>此裝置未能啟動 3D 繪圖，請改用其他瀏覽器再試。</p></div>

var RG={};
function heartGeo(){
  if(RG.heart)return RG.heart;
  var s=new THREE.Shape();s.moveTo(0.25,0.25);s.bezierCurveTo(0.25,0.25,0.2,0,0,0);s.bezierCurveTo(-0.3,0,-0.3,0.35,-0.3,0.35);

  var g=new THREE.ExtrudeGeometry(s,{depth:0.24,bevelEnabled:false,curveSegments:10});g.translate(-0.25,-0.47,-0.12);g.rotateZ(Math.PI);RG.heart=g;return g;
}
function shieldGeo(){
  if(RG.shield)return RG.shield;
  var s=new THREE.Shape();s.moveTo(0,0.85);s.lineTo(0.68,0.6);s.lineTo(0.68,0);s.quadraticCurveTo(0.62,-0.62,0,-0.95);s.quadraticCurveTo(-0.62,-0.62,-0.68,0);s.lineTo(-0.68,0.6);s.lineTo(0,0.85);
  var g=new THREE.ExtrudeGeometry(s,{depth:0.2,bevelEnabled:false,curveSegments:8});g.translate(0,0,-0.1);RG.shield=g;return g;
}
function gearGeo(){
  if(RG.gear)return RG.gear;
  var s=new THREE.Shape(),N=10,i;
  for(i=0;i<N*4;i++){var a=(i-0.5)/(N*4)*Math.PI*2,r=(i%4<2)?0.85:0.63;if(i)s.lineTo(Math.cos(a)*r,Math.sin(a)*r);else s.moveTo(Math.cos(a)*r,Math.sin(a)*r);}
  s.closePath();var h=new THREE.Path();h.absarc(0,0,0.26,0,Math.PI*2,true);s.holes.push(h);
  var g=new THREE.ExtrudeGeometry(s,{depth:0.22,bevelEnabled:false,curveSegments:12});g.translate(0,0,-0.11);RG.gear=g;return g;
}

    if(sx!==undefined)m.scale.set(sx,sy===undefined?sx:sy,sz===undefined?sx:sz);g.add(m);return m;}
  var k;
  switch(i){
  case 0: // 堅毅：山峰與旗幟
    add(new THREE.ConeGeometry(0.95,1.3,5),M,0,-0.25,0);
    add(new THREE.ConeGeometry(0.36,0.5,5),Wm,0,0.16,0);

      add(new THREE.SphereGeometry(0.21,12,10),s<0?M:Gd,s*0.33,0.36,0);
    });
    add(new THREE.CylinderGeometry(1.0,1.0,0.08,24),Dk,0,-0.68,0);
    break;
  case 2: // 責任感：盾牌
    add(shieldGeo(),M);
    add(new THREE.OctahedronGeometry(0.3),Wm,0,0.05,0,0,0,0,1,1.25,0.7);
    break;
  case 3: // 國民身份認同：洋紫荊與星
    for(k=0;k<5;k++){var a=k/5*Math.PI*2+Math.PI/2;add(new THREE.SphereGeometry(0.36,10,8),M,Math.cos(a)*0.5,Math.sin(a)*0.5,0,0,0,a-Math.PI/2,0.72,1.25,0.3);}
    add(new THREE.OctahedronGeometry(0.2),Gd,0,0,0,0,0,0,1,1,1.4);

  case 4: // 承擔精神：扁擔
    add(new THREE.CylinderGeometry(0.045,0.045,1.9,6),Wm,0,0.45,0,0,0,Math.PI/2);
    add(new THREE.SphereGeometry(0.15,10,8),Gd,0,0.45,0);
    [-1,1].forEach(function(s){
      add(new THREE.CylinderGeometry(0.015,0.015,0.7,4),Wm,s*0.8,0.1,0);
      add(new THREE.CylinderGeometry(0.32,0.22,0.38,10),M,s*0.8,-0.42,0);
    });
    break;
  case 5: // 誠信：天秤

  if(autoFx&&bloom.ok&&bloom.on&&playing){frameN++;if(raw>0.042)slowN++;if(frameN>=120){if(slowN>70){bloom.on=false;fxLabel();if(PR>1.25){PR=1.25;renderer.setPixelRatio(PR);resize();}}frameN=0;slowN=0;}}

  halo.position.set(P.x,gUnder+0.07,P.z);var hs=1+Math.sin(tNow*3)*0.06;halo.scale.set(hs*ss,hs*ss,1);halo.material.opacity=0.55*ss;

      if(found===treasures.length){playing=false;input.x=input.y=0;joy.style.display='none';joyId=null;lookId=null;
        setTimeout(function(){musicStop();try{localStorage.setItem('starAdvCh1','1');}catch(e){}$('go2').classList.remove('hide');beep([523,659,784,1047,1319,1568],0.13);$('ws').textContent=score+' / '+stars.length;$('win').classList.remove('hide');$('nav').classList.add('hide');jb.classList.add('hide');},1800);}
    }
  }
  if(near&&playing){var nx=near.x-P.x,nz=near.z-P.z;
    $('arrow').style.transform='rotate('+Math.atan2(nx*rx+nz*rz,nx*fx+nz*fz)+'rad)';

  }

  for(var pm=0;pm<padMeshes.length;pm++){var pp=padMeshes[pm],pu=(tNow*0.9+pm*0.3)%1;pp.r2.position.y=pu*2.2;var prs=1-pu*0.5;pp.r2.scale.set(prs,prs,prs);pp.c.material.opacity=0.1+Math.sin(tNow*4+pm)*0.04;}
  for(var sI=0;sI<streams.length;sI++){var so=streams[sI];if(so.dir){so.z+=so.v*dt;if(so.z>280)so.z=-280;}else{so.x+=so.v*dt;if(so.x>280)so.x=-280;}
    dummy.position.set(so.x,so.y,so.z);dummy.rotation.set(0,so.dir?Math.PI/2:0,0);dummy.scale.set(so.l,1,1);dummy.updateMatrix();streamMesh.setMatrixAt(sI,dummy.matrix);}
  streamMesh.instanceMatrix.needsUpdate=true;
  planet.rotation.y+=dt*0.01;

  // camera
  var cd,chh,cyaw,look;
  if(!playing&&found===0){ // title screen: slow orbit in front of the hero
    cyaw=Math.sin(tNow*0.35)*0.7;cd=5.8;chh=1.9;look=1.25;heading=angLerp(heading,cyaw*0.6,Math.min(1,dt*3));
  }else{
    cd=10.5+(1-ease)*75;chh=5.2+(1-ease)*58;cyaw=yaw+(1-ease)*2.4;look=1.6;
  }
  camY+=(P.y-camY)*Math.min(1,dt*(onGround?6:3.5));
  var cx=P.x+Math.sin(cyaw)*cd,cz=P.z+Math.cos(cyaw)*cd,cyy=Math.max(camY+chh,H(cx,cz)+1.4);
  camera.position.set(cx,cyy,cz);
  camera.lookAt(P.x,camY+look+(P.y-camY)*0.5,P.z);
  if(kick>0.001){kick+=(0-kick)*Math.min(1,dt*3);camera.fov=60+kick*12;camera.updateProjectionMatrix();}
  sky.position.copy(camera.position);
  sun.position.set(camera.position.x+6,camera.position.y+14,camera.position.z+4);sun.target.position.set(P.x,P.y+1,P.z);
  if(flash>0){flash=Math.max(0,flash-dt*2.2);flashEl.style.opacity=(flash*0.45).toFixed(3);}

}
